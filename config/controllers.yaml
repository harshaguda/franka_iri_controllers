/**:
  cartesian_impedance_controller:
    ros__parameters:
      arm_id: "fr3"
      # k_gains: [750.0, 750.0, 750.0, 15.0, 15.0, 15.0]  # Kx, Ky, Kz, Krx, Kry, Krz
      # d_gains: [37.0, 37.0, 37.0, 2.0, 2.0, 2.0]  # Dx, Dy, Dz, Drx, Dry, Drz
      # k_gains: [50.0, 50.0, 50.0, 5.0, 5.0, 5.0]  # Too low - robot doesn't track
      # d_gains: [15.0, 15.0, 15.0, 2.0, 2.0, 2.0]  # Dx, Dy, Dz, Drx, Dry, Drz
      k_gains: [100.0, 100.0, 100.0, 2.0, 2.0, 2.0]  # Kx, Ky, Kz, Krx, Kry, Krz
      d_gains: [25.0, 25.0, 25.0, 2.0, 2.0, 2.0]  # Dx, Dy, Dz, Drx, Dry, Drz
      load_gripper: true
