/**:
  cartesian_impedance_controller:
    ros__parameters:
      arm_id: "fr3"
      load_gripper: true

      # Gripper command interface: true=close (Grasp), false=open (Move)
      gripper_command_topic: "/gripper_command"

      # Use relative names to auto-namespace with the robot/controller manager.
      # If your gripper lives in a different namespace, set these to absolute names
      # (e.g. "/NS_1/franka_gripper/grasp").
      gripper_grasp_action_name: "franka_gripper/grasp"
      gripper_move_action_name: "franka_gripper/move"
      gripper_action_wait_timeout_s: 1.0

      # Open goal (Move)
      gripper_open_width: 0.08
      gripper_open_speed: 0.15

      # Close goal (Grasp)
      gripper_close_width: -0.1
      gripper_close_speed: 0.15
      gripper_close_force: 90.0
      gripper_close_epsilon_inner: 0.005
      gripper_close_epsilon_outer: 0.005

