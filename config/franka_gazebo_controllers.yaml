controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_position_example_controller:
      type: franka_example_controllers/JointPositionExampleController

    joint_velocity_example_controller:
      type: franka_example_controllers/JointVelocityExampleController

    joint_impedance_example_controller:
      type: franka_example_controllers/JointImpedanceExampleController

    gazebo_cartesian_impedance_controller:
      type: franka_iri_controllers/GazeboCartesianImpedanceController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_position_example_controller:
  ros__parameters:
    gazebo: true

joint_velocity_example_controller:
  ros__parameters:
    gazebo: true
  
joint_impedance_example_controller:
  ros__parameters:
    k_gains:
      - 24.0
      - 24.0
      - 24.0
      - 24.0
      - 10.0
      - 6.0
      - 2.0
    d_gains:
      - 2.0
      - 2.0
      - 2.0
      - 1.0
      - 1.0
      - 1.0
      - 0.5

gazebo_cartesian_impedance_controller:
  ros__parameters:
    arm_id: "fr3"
    ee_frame: ""  # empty => auto-select (e.g., fr3_hand_tcp if present, else fr3_link8)
    k_gains:
      - 50.0
      - 50.0
      - 50.0
      - 5.0
      - 5.0
      - 5.0
    d_gains:
      - 3.0
      - 3.0
      - 3.0
      - 2.0
      - 2.0
      - 2.0
